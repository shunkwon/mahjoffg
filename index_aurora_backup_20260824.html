<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahjoffg</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');

    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; overflow: hidden; color: #263027;
      font: 14px/1.45 "DM Mono", ui-monospace, monospace;
      background: #f4f2e9;
    }
    .aurora, .grain { position: fixed; inset: 0; pointer-events: none; }
    .aurora { overflow: hidden; isolation: isolate; }
    .aurora::before, .aurora::after, .orb { content: ""; position: absolute; border-radius: 50%; filter: blur(22px); will-change: transform; }
    .aurora::before { width: 66vmax; height: 66vmax; left: -26vmax; top: -31vmax; background: #f5d76e; opacity: .48; animation: drift-one 20s ease-in-out infinite alternate; }
    .aurora::after { width: 62vmax; height: 62vmax; right: -27vmax; bottom: -30vmax; background: #a5d4ae; opacity: .56; animation: drift-two 24s ease-in-out infinite alternate; }
    .orb.one { width: 45vmax; height: 45vmax; left: 28vw; top: 15vh; background: #b4dff0; opacity: .53; mix-blend-mode: multiply; animation: drift-three 17s ease-in-out infinite alternate; }
    .orb.two { width: 33vmax; height: 33vmax; right: 12vw; top: -22vmax; background: #e9a64a; opacity: .31; mix-blend-mode: multiply; animation: drift-four 28s ease-in-out infinite alternate; }
    .cursor-light { width: 30vmax; height: 30vmax; left: var(--cursor-x, 50%); top: var(--cursor-y, 50%); position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; filter: blur(30px); background: radial-gradient(circle, rgba(255,255,246,.62) 0, rgba(250,209,103,.19) 30%, transparent 70%); transform: translate(-50%, -50%); transition: opacity .7s ease; mix-blend-mode: soft-light; will-change: left, top; }
    body.is-pointing .cursor-light { opacity: 1; }
    .grain { opacity: .09; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E"); mix-blend-mode: overlay; }
    main { position: relative; z-index: 1; width: min(1100px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0; }
    nav { display: flex; align-items: center; justify-content: space-between; animation: rise .7s both; }
    .brand { font-family: "Playfair Display", Georgia, serif; font-size: 25px; letter-spacing: -.8px; }
    .glass {
      background: linear-gradient(135deg, rgba(255,255,255,.73), rgba(255,255,255,.34));
      border: 1px solid rgba(255,255,255,.88); box-shadow: 0 24px 56px rgba(77,83,54,.15), inset 0 1px rgba(255,255,255,.9), inset 0 0 28px rgba(255,255,255,.28);
      backdrop-filter: blur(30px) saturate(108%); -webkit-backdrop-filter: blur(30px) saturate(108%);
    }
    .hero { min-height: 420px; margin-top: 32px; padding: clamp(30px, 6vw, 76px); border-radius: 30px; position: relative; overflow: hidden; animation: rise .8s .1s both; }
    .hero::after { content: ""; position: absolute; width: 310px; height: 310px; border: 1px solid rgba(97,132,84,.22); border-radius: 50%; right: -85px; top: -125px; box-shadow: 0 0 70px #edcf62; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift-one { 0% { transform: translate3d(0,0,0) scale(1); } 45% { transform: translate3d(25vw, 18vh, 0) scale(1.12); } 100% { transform: translate3d(8vw, 38vh, 0) scale(.92); } }
    @keyframes drift-two { 0% { transform: translate3d(0,0,0) scale(1); } 55% { transform: translate3d(-28vw, -24vh, 0) scale(.88); } 100% { transform: translate3d(-7vw, -43vh, 0) scale(1.1); } }
    @keyframes drift-three { 0% { transform: translate3d(-18vw, 13vh, 0) scale(.82); } 52% { transform: translate3d(24vw, -18vh, 0) scale(1.14); } 100% { transform: translate3d(42vw, 27vh, 0) scale(.9); } }
    @keyframes drift-four { 0% { transform: translate3d(4vw, 0, 0) scale(.8); } 48% { transform: translate3d(-35vw, 36vh, 0) scale(1.2); } 100% { transform: translate3d(-54vw, 14vh, 0) scale(.85); } }
    @media (prefers-reduced-motion: reduce) { .aurora::before, .aurora::after, .orb.one, .orb.two { animation-play-state: paused; } .cursor-light { display: none; } *, *::before, *::after { scroll-behavior: auto !important; } }
    @media (max-width: 680px) { body { overflow: auto; } main { width: min(100% - 28px, 1100px); } .hero { min-height: 390px; } }
  </style>
</head>
<body>
  <div class="aurora"><span class="orb one"></span><span class="orb two"></span><span class="cursor-light"></span></div><div class="grain"></div>
  <main>
    <nav><div class="brand">Mahjoffg</div></nav>
    <section class="hero glass" aria-hidden="true"></section>
  </main>
  <script>
    if (matchMedia('(pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      let frame;
      let x = innerWidth / 2;
      let y = innerHeight / 2;
      const paintLight = () => {
        document.documentElement.style.setProperty('--cursor-x', `${x}px`);
        document.documentElement.style.setProperty('--cursor-y', `${y}px`);
        frame = null;
      };
      addEventListener('pointermove', ({ clientX, clientY }) => {
        x = clientX; y = clientY;
        document.body.classList.add('is-pointing');
        if (!frame) frame = requestAnimationFrame(paintLight);
      }, { passive: true });
      addEventListener('pointerleave', () => document.body.classList.remove('is-pointing'));
    }
  </script>
</body>
</html>
