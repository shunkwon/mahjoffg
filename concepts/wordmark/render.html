<!doctype html>
<meta charset="utf-8">
<!-- Draws the masthead wordmark once, large, and writes its coverage (alpha
     only, cropped to the inked pixels) into the DOM as base64 for
     make-favicon.mjs to read via --dump-dom. Weight 600 and letter-spacing
     −0.03em are the masthead's .site-brand; the face is the Inter file named
     in the URL hash (fonts/, SIL OFL 1.1), never a system font. The crop comes from the pixels, not measureText,
     whose boxes are off by a pixel or more at small sizes. -->
<body>
<pre id="out"></pre>
<script>
const PX = 400;
(async () => {
// #<font file>|<text>; text defaults to the wordmark
const [file, TEXT = 'Mahjoffg'] = decodeURIComponent(location.hash.slice(1)).split('|');
const face = new FontFace('Mark', `url(fonts/${file})`, { weight: '600' });
document.fonts.add(await face.load());
const FONT = 'Mark';
const cv = document.createElement('canvas');
cv.width = PX * 6; cv.height = PX * 2;
const g = cv.getContext('2d');
g.font = `600 ${PX}px ${FONT}`;
g.letterSpacing = `${-0.03 * PX}px`;
g.fillStyle = '#000';
g.fillText(TEXT, PX / 2, PX * 1.3);
const W = cv.width, H = cv.height, d = g.getImageData(0, 0, W, H).data;
let x0 = W, x1 = -1, y0 = H, y1 = -1;
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3]) {
  if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
}
if (x0 === 0 || y0 === 0 || x1 === W - 1 || y1 === H - 1) throw new Error('master canvas too small');
const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
let s = '';
for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) s += String.fromCharCode(d[(y * W + x) * 4 + 3]);
document.getElementById('out').textContent = `${cw} ${ch} ${btoa(s)}`;
})().catch((e) => { document.getElementById('out').textContent = 'ERROR ' + e; });
</script>
